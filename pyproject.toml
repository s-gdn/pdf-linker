[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-linker"
version = "0.3.0"
description = "Local spreadsheet-to-PDF desktop workspace"
readme = "README.md"
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7", "PyMuPDF>=1.26,<2", "openpyxl>=3.1,<4", "xlrd>=2.0,<3", "rapidfuzz>=3.14,<4", "onnxruntime>=1.20,<2", "tokenizers>=0.21,<1", "numpy>=2,<3"]

[project.optional-dependencies]
dev = ["pyinstaller>=6"]
semantic = ["rapidfuzz>=3.14,<4", "onnxruntime>=1.20,<2", "tokenizers>=0.21,<1", "numpy>=2,<3"]

[project.gui-scripts]
pdf-linker = "pdflinker.app:main"

[tool.setuptools.packages.find]
include = ["pdflinker*"]

[tool.setuptools.package-data]
pdflinker = ["assets/*.svg", "assets/*.png", "assets/*.ico", "assets/*.json", "models/medium-v1/*", "models/medium-v1/models/*/*", "models/medium-v1/licences/*"]
